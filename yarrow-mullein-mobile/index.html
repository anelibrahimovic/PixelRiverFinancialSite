<!doctype html>
<html lang="en-CA">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f39"><meta name="description" content="Yarrow–Mullein Bank mobile banking educational prototype"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><title>Yarrow–Mullein Bank · Mobile prototype</title>
<style>body{font-family:system-ui,Arial;background:#e8eee7;color:#173f39;margin:0;display:grid;min-height:100dvh;place-content:center;padding:22px;text-align:center}main{max-width:340px}h1{font-size:1.5rem}p{line-height:1.6}button{padding:13px;border:0;background:#173f39;color:white;border-radius:9px;font:inherit}</style></head>
<body><main id="loading" aria-live="polite"><h1>Yarrow–Mullein Bank</h1><p>Opening your mobile banking demonstration…</p></main>
<script type="module">
try {
 if (typeof DecompressionStream === 'undefined') throw new Error('This browser does not support compressed pages. Use an up-to-date Chrome, Edge, Firefox or Safari browser.');
 const chunks = await Promise.all([0,1,2,3].map(n=>fetch('bundle.'+n+'.txt').then(r=>{if(!r.ok)throw Error('Missing app data ('+n+')');return r.text()})));
 const bin = Uint8Array.from(atob(chunks.join('').trim()),ch=>ch.charCodeAt(0));
 const unpacked = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
 const html = await new Response(unpacked).text();
 document.open(); document.write(html); document.close();
} catch(err) {
 document.getElementById('loading').innerHTML = '<h1>Unable to open the demo</h1><p>'+String(err.message).replace(/[<>&]/g,'')+'</p><p>Check your connection and reload, or use the downloadable standalone.html from the project package.</p>';
}
</script>
</body></html>
